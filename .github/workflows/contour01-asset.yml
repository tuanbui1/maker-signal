name: Add contour-01 preview asset
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contour01-asset.yml"
permissions:
  contents: write
jobs:
  add-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify preview image
        run: |
          curl -fsSL -o contour-01/contour-01-preview.jpg 'https://tmpfiles.org/dl/1787809119.e2557b2a99606ffd/wOwLGDDpTDp7/contour-01-preview.jpg'
          echo "1e06577a605bccebb1dc3332dc4b2a170c9a743d28bd8b569eae5b165e69cec4  contour-01/contour-01-preview.jpg" | sha256sum -c -
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contour-01/contour-01-preview.jpg
          git commit -m "Add contour-01 preview image"
          git push
